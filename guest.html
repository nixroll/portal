<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#624F40" id="tc">
<title>Портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Страница портала для гостей. Один файл на все заведения: данные берёт из ./portal.json рядом.
   В кабинете тот же файл работает как превью (?embed=1): данные приходят через postMessage.
   Раскладка как у Linktree: фон на весь экран, по центру колонка шириной до 580 px. */
:root{--bg:#624F40;--fg:#fff;--fg2:rgba(255,255,255,.64);--chip:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--h:.5px}
@media (min-resolution:2.5dppx){:root{--h:.671875px}}
@media (max-resolution:1.49dppx){:root{--h:1px}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:var(--fg);font:400 14px/20px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
.page{display:flex;flex-direction:column;align-items:center;gap:40px;max-width:580px;margin:0 auto;padding:48px 16px calc(48px + env(safe-area-inset-bottom))}
@media (min-width:768px){body:not(.embed) .page{padding-top:80px;padding-bottom:80px}}
.hd{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.ava{width:96px;height:96px;border-radius:9999px;box-shadow:0 0 0 var(--h) var(--line);overflow:hidden}
.ava img{display:block;width:96px;height:96px;object-fit:cover}
.nm{display:flex;flex-direction:column;gap:2px;width:100%;text-align:center}
.nm h1{margin:0;font-size:20px;line-height:30px;font-weight:600}
.nm span{color:var(--fg2)}
.cards{display:flex;flex-direction:column;gap:12px;width:100%}
/* карточка: пропорция из макета (338 × 240,5), скругление 20, градиент снизу, текст снизу */
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;width:100%;aspect-ratio:338/240.5;padding:21px;border-radius:20px;overflow:hidden;text-align:left;
  background:linear-gradient(180deg,rgba(45,50,50,0),rgba(16,18,18,.6)),var(--img) center/cover,#2D3232;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 1px 2px rgba(10,13,18,.05);transition:transform .15s}
.card:active{transform:scale(.99)}
.card b{font-size:18px;line-height:28px;font-weight:600;color:#fff}
.card span{color:rgba(255,255,255,.6)}
.soc{display:flex;gap:16px}
.soc a{display:grid;place-items:center;width:48px;height:48px;border-radius:9999px;background:var(--chip);box-shadow:inset 0 0 0 var(--h) var(--line);color:var(--fg2)}
.soc svg{width:24px;height:24px}
.closed{min-height:60vh;display:grid;place-items:center;text-align:center;color:var(--fg2)}
/* экран меню и условий: на весь экран поверх, та же колонка */
.sheet{position:fixed;inset:0;z-index:10;overflow-y:auto;background:var(--bg);-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sh-in{max-width:580px;margin:0 auto;padding:0 16px calc(48px + env(safe-area-inset-bottom))}
.sh-top{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0 12px;background:var(--bg)}
.sh-top h2{margin:0;font-size:20px;line-height:30px;font-weight:600}
.x{display:grid;place-items:center;width:36px;height:36px;border-radius:9999px;background:var(--chip);box-shadow:inset 0 0 0 var(--h) var(--line);color:var(--fg2)}
.cats{position:sticky;top:58px;z-index:2;display:flex;gap:8px;margin:0 -16px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.cats::-webkit-scrollbar{display:none}
.cats a{flex:none;height:32px;padding:6px 12px;border-radius:9999px;background:var(--chip);box-shadow:inset 0 0 0 var(--h) var(--line);color:var(--fg2);font-weight:500}
.cats a.on{color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg2)}
.cat{scroll-margin-top:108px;padding-top:16px}
.cat h3{margin:0 0 4px;font-size:16px;line-height:24px;font-weight:600}
.it{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:12px 0;box-shadow:inset 0 calc(-1 * var(--h)) 0 var(--line)}
.it:last-child{box-shadow:none}
.it b{display:block;font-size:16px;line-height:24px;font-weight:500}
.it small{display:block;color:var(--fg2)}
.it .pr{flex:none;font-size:16px;line-height:24px;font-weight:500;white-space:nowrap}
.terms{display:flex;flex-direction:column;margin-top:8px}
.terms div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;box-shadow:inset 0 calc(-1 * var(--h)) 0 var(--line)}
.terms div:last-child{box-shadow:none}
.terms span{color:var(--fg2)}
.terms b{font-weight:500;text-align:right}
body.lock{overflow:hidden}
body.embed{scrollbar-width:none}
body.embed::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<main class="page" id="page"></main>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT"><div class="sh-in" id="shIn"></div></div>
<script>
(function(){

  "be":{menu:"Меню",close:"Закрыць",loyalty:"Праграма лаяльнасці",closed:"Партал часова недаступны",empty:"Меню хутка з’явіцца",kind:"Тып",size:"Памер",scope:"Дзейнічае на",stack:"Разам з іншымі акцыямі",phone:"Уваход па нумары тэлефона",welcome:"Вітальны бонус",yes:"Так",no:"Не"},
  "en":{menu:"Menu",close:"Close",loyalty:"Loyalty program",closed:"This page is temporarily unavailable",empty:"Menu is coming soon",kind:"Type",size:"Amount",scope:"Applies to",stack:"Combines with other offers",phone:"Sign in with phone",welcome:"Welcome bonus",yes:"Yes",no:"No"}};
function t(k){return (T[D&&D.lang]||T.ru)[k]}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var X='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
var ICON={google:'<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M16.8426 6.54781C15.6036 5.36611 13.9501 4.72235 12.2392 4.74881C9.10863 4.74881 6.44981 6.86086 5.5018 9.70486V9.70493C4.99913 11.1953 4.99913 12.8091 5.50179 14.2994H5.50619C6.45861 17.139 9.11303 19.2511 12.2437 19.2511C13.8597 19.2511 15.247 18.8378 16.3223 18.1077V18.1047C17.5878 17.2669 18.452 15.9486 18.721 14.4582H12.2393V9.83722H23.558C23.6991 10.6397 23.7653 11.4599 23.7653 12.2756C23.7653 15.9254 22.4609 19.0112 20.1913 21.1012L20.1937 21.103C18.2051 22.9373 15.4757 24 12.2392 24C7.70204 24 3.55286 21.4426 1.51575 17.3904V17.3904C-0.186243 13.9996 -0.186239 10.0048 1.51576 6.61398H1.51579L1.51575 6.61395C3.55286 2.55737 7.70204 -4.58262e-05 12.2392 -4.58262e-05C15.22 -0.0353205 18.0992 1.08465 20.2686 3.12176L16.8426 6.54781Z"/></svg>',
  linkedin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.2234 0H1.77187C0.792187 0 0 0.773438 0 1.72969V22.2656C0 23.2219 0.792187 24 1.77187 24H22.2234C23.2031 24 24 23.2219 24 22.2703V1.72969C24 0.773438 23.2031 0 22.2234 0ZM7.12031 20.4516H3.55781V8.99531H7.12031V20.4516ZM5.33906 7.43438C4.19531 7.43438 3.27188 6.51094 3.27188 5.37187C3.27188 4.23281 4.19531 3.30937 5.33906 3.30937C6.47813 3.30937 7.40156 4.23281 7.40156 5.37187C7.40156 6.50625 6.47813 7.43438 5.33906 7.43438ZM20.4516 20.4516H16.8937V14.8828C16.8937 13.5562 16.8703 11.8453 15.0422 11.8453C13.1906 11.8453 12.9094 13.2937 12.9094 14.7891V20.4516H9.35625V8.99531H12.7687V10.5609H12.8156C13.2891 9.66094 14.4516 8.70938 16.1813 8.70938C19.7859 8.70938 20.4516 11.0813 20.4516 14.1656V20.4516Z"/></svg>',
  telegram:'<svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M24 12C24 18.6274 18.6274 24 12 24C5.37258 24 0 18.6274 0 12C0 5.37258 5.37258 0 12 0C18.6274 0 24 5.37258 24 12ZM12.4301 8.85893C11.263 9.3444 8.93026 10.3492 5.43201 11.8733C4.86395 12.0992 4.56638 12.3202 4.53929 12.5363C4.49351 12.9015 4.95083 13.0453 5.57359 13.2411C5.6583 13.2678 5.74608 13.2954 5.83606 13.3246C6.44876 13.5238 7.27295 13.7568 7.70141 13.766C8.09007 13.7744 8.52385 13.6142 9.00276 13.2853C12.2713 11.079 13.9585 9.96381 14.0644 9.93977C14.1392 9.92281 14.2427 9.90148 14.3129 9.96385C14.3831 10.0262 14.3762 10.1443 14.3687 10.176C14.3234 10.3691 12.5282 12.0381 11.5992 12.9018C11.3096 13.171 11.1042 13.362 11.0622 13.4056C10.9681 13.5033 10.8722 13.5958 10.7801 13.6846C10.2109 14.2333 9.78403 14.6448 10.8037 15.3168C11.2938 15.6397 11.6859 15.9067 12.0771 16.1731C12.5043 16.4641 12.9304 16.7543 13.4817 17.1157C13.6222 17.2077 13.7564 17.3034 13.887 17.3965C14.3842 17.751 14.8309 18.0694 15.3827 18.0186C15.7034 17.9891 16.0346 17.6876 16.2028 16.7884C16.6003 14.6631 17.3817 10.0585 17.5623 8.16097C17.5782 7.99473 17.5583 7.78197 17.5423 7.68857C17.5263 7.59518 17.4929 7.46211 17.3715 7.3636C17.2277 7.24694 17.0058 7.22234 16.9065 7.22408C16.4551 7.23203 15.7627 7.47282 12.4301 8.85893Z"/></svg>'};
/* цвет текста по яркости фона, как в кабинете */
function colors(bg){var rgb=[1,3,5].map(function(i){var c=parseInt(bg.substr(i,2),16)/255;return c<=.04045?c/12.92:Math.pow((c+.055)/1.055,2.4)}),l=.2126*rgb[0]+.7152*rgb[1]+.0722*rgb[2],f=l>.4?"16,24,40":"255,255,255",r=document.documentElement.style;
  r.setProperty("--bg",bg);r.setProperty("--fg","rgb("+f+")");r.setProperty("--fg2","rgba("+f+",.64)");r.setProperty("--chip","rgba("+f+",.08)");r.setProperty("--line","rgba("+f+",.12)");$("#tc").content=bg}
function price(v){return v==null||v===""?"":Number(v).toFixed(2).replace(".",",")+" "+(D.cur||"BYN")}
function render(){colors(D.color||"#624F40");document.documentElement.lang=D.lang||"ru";if(!embed)document.title=D.name||"Портал";
  if(!embed){var m=document.querySelector('meta[name="robots"]');if(!D.seo&&!m){m=document.createElement("meta");m.name="robots";m.content="noindex";document.head.appendChild(m)}}
  if(!D.online){$("#page").innerHTML='<div class="closed">'+t("closed")+'</div>';return}
  var tgt=D.newtab&&!embed?' target="_blank" rel="noopener"':'';
  $("#page").innerHTML='<header class="hd"><div class="ava"><img src="'+esc(D.logo)+'" alt="" width="96" height="96"></div><div class="nm"><h1>'+esc(D.name)+'</h1><span>'+esc(D.hours)+'</span></div></header>'+
    '<div class="cards">'+(D.cards||[]).filter(inRange).map(function(c,i){var a=' class="card"'+(c.img?' style="--img:url(\''+esc(c.img)+'\')"':'');
      var inner='<b>'+esc(c.title)+'</b>'+(c.sub?'<span>'+esc(c.sub)+'</span>':'');
      return c.kind=="link"?'<a'+a+' href="'+esc(c.href)+'"'+tgt+'>'+inner+'</a>':'<button'+a+' data-open="'+c.kind+'">'+inner+'</button>'}).join("")+'</div>'+
    ((D.links||[]).length?'<nav class="soc">'+D.links.map(function(l){return '<a href="'+esc(l.href)+'"'+tgt+' aria-label="'+esc(l.name)+'">'+(ICON[l.id]||"")+'</a>'}).join("")+'</nav>':'');
  if(embed&&!$("#sheet").hidden)openSheet(cur)}
/* карточка меню может показываться только в выбранные даты (дд.мм.гггг) */
function inRange(c){if(!c.from&&!c.to)return true;function d(s){var a=/^(\d\d)\.(\d\d)\.(\d{4})$/.exec(s||"");return a?new Date(+a[3],a[2]-1,+a[1]):null}
  var f=d(c.from),t=d(c.to),n=new Date();n.setHours(0,0,0,0);return (!f||n>=f)&&(!t||n<=t)}
var cur=null;
function openSheet(kind){cur=kind;var h="";
  if(kind=="menu"){var cats=[];(D.menu||[]).forEach(function(i){if(cats.indexOf(i.cat)<0)cats.push(i.cat)});
    h='<div class="sh-top"><h2 id="shT">'+t("menu")+'</h2><button class="x" data-x aria-label="'+t("close")+'">'+X+'</button></div>'+
      (cats.length>1?'<nav class="cats">'+cats.map(function(c,i){return '<a href="#c'+i+'"'+(i?'':' class="on"')+'>'+esc(c)+'</a>'}).join("")+'</nav>':'')+
      (cats.length?cats.map(function(c,i){return '<section class="cat" id="c'+i+'"><h3>'+esc(c)+'</h3>'+D.menu.filter(function(x){return x.cat==c}).map(function(x){
        var sub=[x.desc,x.out].filter(Boolean).join(" · ");return '<div class="it"><div><b>'+esc(x.name)+'</b>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div><span class="pr">'+price(x.price)+'</span></div>'}).join("")+'</section>'}).join(""):'<p class="closed">'+t("empty")+'</p>')}
  else{var L=D.loyalty||{};h='<div class="sh-top"><h2 id="shT">'+t("loyalty")+'</h2><button class="x" data-x aria-label="'+t("close")+'">'+X+'</button></div><div class="terms">'+
    [[t("kind"),L.kind],[t("size"),L.size],[t("scope"),L.scope],[t("stack"),L.stack?t("yes"):t("no")]].concat(L.phone?[[t("phone"),t("yes")],[t("welcome"),L.welcome]]:[]).map(function(r){return '<div><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'}).join("")+'</div>'}
  $("#shIn").innerHTML=h;var s=$("#sheet");if(s.hidden){s.hidden=false;s.scrollTop=0;document.body.classList.add("lock");if(!embed&&location.hash!="#"+kind)history.pushState(null,"","#"+kind)}}
function closeSheet(back){var s=$("#sheet");if(s.hidden)return;s.hidden=true;cur=null;document.body.classList.remove("lock");if(back&&!embed&&location.hash)history.back()}
document.addEventListener("click",function(e){var o=e.target.closest("[data-open]");if(o){openSheet(o.dataset.open);return}
  if(e.target.closest("[data-x]")){closeSheet(true);return}
  var a=e.target.closest(".cats a");if(a){e.preventDefault();var el=$(a.getAttribute("href"));if(el)el.scrollIntoView({behavior:"smooth"});document.querySelectorAll(".cats a").forEach(function(x){x.classList.toggle("on",x==a)})}
  if(embed){var l=e.target.closest("a[href]");if(l&&!l.closest(".cats"))e.preventDefault()}});
document.addEventListener("keydown",function(e){if(e.key=="Escape")closeSheet(true)});
addEventListener("popstate",function(){if(location.hash=="#menu"||location.hash=="#loyalty")openSheet(location.hash.slice(1));else closeSheet(false)});
if(embed){addEventListener("message",function(e){if(e.data&&e.data.type=="portal"){D=e.data.data;render()}});parent.postMessage({type:"portal-ready"},"*")}
else fetch("portal.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){D=d;render();if(location.hash=="#menu"||location.hash=="#loyalty")openSheet(location.hash.slice(1))})
  .catch(function(){D={online:false,lang:"ru"};render()});
})();
</script>
