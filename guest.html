<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#23151F" id="tc">
<title>Портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Страница портала для гостей — по макету Figma «Портал» (Home / Сначала, Home / Скроллинг, Меню).
   Один файл на все заведения: данные из ./portal.json рядом. В кабинете — превью (?embed=1), данные через postMessage.
   Колонка 320–560 px по центру, фон на весь экран. Все полупрозрачные цвета — от цвета текста (--c), чтобы работали и на светлом фоне. */
:root{--bg:#23151F;--c:255,255,255;--on:#000;--muted:#A6A6A6;--h:.5px;--h7:.7px}
@media (min-resolution:2.5dppx){:root{--h:.671875px;--h7:.671875px}}
@media (max-resolution:1.49dppx){:root{--h:1px;--h7:1px}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{color:rgb(var(--c));font:400 14px/20px Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
p,h1,h2,h3{margin:0}
[hidden]{display:none!important}
.wrap{width:100%;min-width:320px;max-width:560px;margin:0 auto;padding:0 20px}
/* ===== Лента ===== */
.home{display:flex;flex-direction:column;align-items:center;gap:64px;padding:80px 0 calc(104px + env(safe-area-inset-bottom))}
.hero{display:flex;flex-direction:column;align-items:center;gap:32px}
.who{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.ava{width:96px;height:96px;border-radius:9999px;box-shadow:inset 0 0 0 3px rgba(var(--c),.2);background:var(--img) center/cover}
.who h1{font-size:24px;line-height:32px;font-weight:500;text-align:center;width:100%;word-break:break-word}
.who p{margin-top:2px;font-size:14px;line-height:20px;color:rgba(var(--c),.7);text-align:center}
.acts{display:flex;justify-content:center;gap:8px;width:100%}
.b{display:flex;align-items:center;justify-content:center;height:44px;min-width:148px;padding:0 16px;border-radius:999px;font-size:15px;line-height:24px;font-weight:500;white-space:nowrap}
.b.sec{-webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);background:linear-gradient(rgba(var(--c),.1),rgba(var(--c),.03));box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.2);color:rgba(var(--c),.9)}
.b.pri{background:rgba(var(--c),.9);box-shadow:inset 0 0 0 var(--h7) rgb(var(--c));color:var(--on)}
.b.sm{height:40px}
@media (max-width:339px){.acts .b{flex:1 1 0;min-width:0;padding:0 10px}} /* на самой узкой ширине две кнопки делят строку поровну */
.feed{display:flex;flex-direction:column;gap:20px}
.tabs{display:flex;gap:6px;width:100%}
.tab{flex:1 0 0;min-width:0;display:flex;align-items:center;justify-content:center;height:40px;padding:0 16px;border-radius:999px;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),0);
  -webkit-backdrop-filter:blur(15px);backdrop-filter:blur(15px);font-size:15px;line-height:24px;font-weight:500;color:rgba(var(--c),.6);white-space:nowrap}
.tab.on{background:rgba(var(--c),.1);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.1);color:rgba(var(--c),.9)}
.cards{display:flex;flex-direction:column;gap:16px}
.card{position:relative;display:flex;flex-direction:column;justify-content:flex-end;width:100%;aspect-ratio:400/260;padding:20px;border-radius:20px;overflow:hidden;text-align:left;
  background:linear-gradient(180deg,rgba(45,50,50,0),rgba(16,18,18,.6)),var(--img,none) center/cover,#2D3232;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.card b{font-size:18px;line-height:28px;font-weight:600;color:#fff}
.card span{font-size:14px;line-height:20px;color:rgba(255,255,255,.6)}
/* «О нас»: короткое описание заведения, ниже — адрес, время, телефон */
.desc{margin-bottom:8px;font-size:16px;line-height:24px;color:rgba(var(--c),.8);word-break:break-word}
.about{display:flex;flex-direction:column}
.about div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;box-shadow:inset 0 calc(-1 * var(--h7)) 0 rgba(var(--c),.1)}
.about div:last-child{box-shadow:none}
.about span{color:rgba(var(--c),.6)}
.about b,.about a{font-weight:500;text-align:right}
.foot{display:flex;flex-direction:column;align-items:center;gap:24px}
.soc{display:flex;gap:12px}
.soc a{display:grid;place-items:center;width:48px;height:48px;border-radius:999px;background:linear-gradient(rgba(var(--c),.1),rgba(var(--c),.03));box-shadow:inset 0 0 0 var(--h) rgba(var(--c),.2);color:rgba(var(--c),.8)}
.soc svg{display:block;width:24px;height:24px}
.copy{font-size:14px;line-height:20px;color:var(--muted);text-align:center}
/* док снизу: Лента · Меню · О нас — всегда на экране, через него ходим между разделами */
.panel{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:20px 0 calc(20px + env(safe-area-inset-bottom));background:var(--bg);box-shadow:inset 0 var(--h7) 0 rgba(var(--c),.1)}
/* таб-бар с иконками (макет Figma «Tab bar»): Главная · Меню · Бронирование · Карта гостя; высота 56, иконки 24 */
.tbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);box-shadow:inset 0 var(--h7) 0 rgba(var(--c),.1);padding-bottom:env(safe-area-inset-bottom)}
.tbar .in{display:flex;max-width:560px;margin:0 auto;padding:0 16px}
.tbar button{flex:1 0 0;display:grid;place-items:center;height:56px;min-width:0;color:rgba(var(--c),.55);transition:color .15s}
.tbar button svg{width:24px;height:24px}
.tbar button.on{color:rgb(var(--c))}
@media (hover:hover){.tbar button:not(.on):hover{color:rgba(var(--c),.8)}}
/* ===== Бронирование: день · гости · время · длительность · стол на схеме зала ===== */
.bk{display:flex;flex-direction:column;gap:28px}
.bs{display:flex;flex-direction:column;gap:12px}
.bs h3,.bh h3{font-size:15px;line-height:20px;font-weight:600}
.bh{display:flex;align-items:center;justify-content:space-between;gap:16px}
.tab.two{height:56px;flex-direction:column;gap:0;padding:0 6px;border-radius:16px;line-height:20px}
.tab.two span,.tab.two small{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tab.two small{font-size:12px;line-height:16px;font-weight:400;opacity:.7}
.tab:disabled{opacity:.35;cursor:default}
.dur .tab{padding:0 6px}
.hs{display:flex;gap:6px;margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.hs .tab{flex:none;font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;gap:12px}
.stp b{min-width:20px;font-size:16px;line-height:24px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.stp .rb{font-size:20px;line-height:24px;font-weight:500}
.stp .rb:disabled{opacity:.35;cursor:default}
/* схема зала: квадрат, координаты столов в процентах */
.hall{position:relative;aspect-ratio:1;border-radius:20px;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.16)}
.hall i{position:absolute;font-style:normal;font-size:11px;line-height:14px;color:rgba(var(--c),.45);text-align:center}
.hall .win{position:absolute;top:0;height:3px;border-radius:0 0 3px 3px;background:rgba(var(--c),.3)}
.hall .door{position:absolute;bottom:0;height:3px;background:var(--bg)}
.hall .bar{position:absolute;display:grid;place-items:center;border-radius:12px;background:rgba(var(--c),.08);color:rgba(var(--c),.5);font-size:12px;line-height:16px}
.tbl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:rgba(var(--c),.07);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.2);transition:background .15s,box-shadow .15s,color .15s}
.tbl.rd{border-radius:9999px}
.tbl b{font-size:16px;line-height:20px;font-weight:600}
.tbl small{font-size:11px;line-height:14px;color:rgba(var(--c),.6);white-space:nowrap}
.tbl.bz,.tbl.sm{opacity:.35;cursor:default}
.tbl.bz{background:repeating-linear-gradient(-45deg,rgba(var(--c),.14) 0 2px,transparent 2px 7px),rgba(var(--c),.03)}
.tbl.on{background:rgba(var(--c),.9);box-shadow:inset 0 0 0 var(--h7) rgb(var(--c));color:var(--on)}
.tbl.on small{color:var(--on);opacity:.7}
.bnote{font-size:13px;line-height:18px;color:rgba(var(--c),.5)}
.bsum{display:flex;flex-direction:column;gap:12px}
.bsum p{font-size:15px;line-height:22px}
.bsum .b{width:100%}
.b:disabled{opacity:.4;cursor:default}
.inp{width:100%;height:48px;padding:0 16px;border:0;border-radius:14px;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.2);color:inherit;font:inherit;font-size:16px;line-height:24px;outline:none}
.inp::placeholder{color:rgba(var(--c),.4)}
.inp:focus{box-shadow:inset 0 0 0 1px rgba(var(--c),.6)}
.inp.err{box-shadow:inset 0 0 0 1px #F97066}
.bdone{display:flex;flex-direction:column;align-items:center;padding-top:24px;text-align:center}
.bok{display:grid;place-items:center;width:80px;height:80px;border-radius:9999px;background:rgba(var(--c),.92);color:var(--on);box-shadow:0 0 0 10px rgba(var(--c),.06),0 0 0 20px rgba(var(--c),.03);animation:bpop .5s cubic-bezier(.2,1.4,.4,1)}
.bok svg{width:40px;height:40px}
.bok path{stroke-dasharray:30;stroke-dashoffset:30;animation:bdraw .4s .3s ease-out forwards}
@keyframes bpop{from{transform:scale(.6);opacity:0}}
@keyframes bdraw{to{stroke-dashoffset:0}}
.bdone h3{margin-top:36px;font-size:24px;line-height:32px;font-weight:500}
.bdone>p{margin-top:6px;font-size:16px;line-height:24px;color:rgba(var(--c),.7)}
.bdone .terms{width:100%;margin-top:28px;padding:4px 16px;border-radius:20px;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.12);text-align:left}
.bdone>p.bnote{margin-top:16px;font-size:13px;line-height:18px;color:rgba(var(--c),.5)}
.bdone .b{width:100%;margin-top:28px}
/* контакты на экране карты гостя */
.gacts .b{flex:1 1 0;min-width:0}
/* вакансии */
.jobs{display:flex;flex-direction:column;gap:24px}
.job{display:flex;flex-direction:column;gap:4px;padding-bottom:24px;box-shadow:inset 0 calc(-1 * var(--h7)) 0 rgba(var(--c),.1)}
.job h3{font-size:18px;line-height:28px;font-weight:600}
.job small{font-size:13px;line-height:18px;color:rgba(var(--c),.6)}
.job p{margin-top:8px;font-size:15px;line-height:22px;color:rgba(var(--c),.8)}
.jobs .b{width:100%}
/* ===== Меню ===== */
.mtop{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;flex-direction:column;gap:16px;padding:16px 0;background:var(--bg);box-shadow:inset 0 calc(-1 * var(--h7)) 0 rgba(var(--c),.1)}
.mrow{display:flex;align-items:center;gap:16px}
.mrow h2{flex:1 0 0;min-width:0;font-size:16px;line-height:24px;font-weight:600;text-align:center}
.rb{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:9999px;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.06);color:rgb(var(--c))}
.rb svg{display:block;width:26px;height:26px}
.rb.ghost{visibility:hidden}
.chips{display:flex;gap:6px;width:100%;max-width:560px;margin:0 auto;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .tab{flex:none}
.menu{padding:148px 0 calc(100px + 56px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 16px}
.it{display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
button.it{width:100%}
.pic{transition:box-shadow .15s}
@media (hover:hover){button.it:hover .pic{box-shadow:inset 0 0 0 1px rgba(var(--c),.3)}}
/* ===== Карточка блюда ===== */
.dpg{padding-bottom:calc(100px + 56px + env(safe-area-inset-bottom))}
.dhero{position:relative;width:100%;max-width:560px;margin:0 auto;aspect-ratio:1;background:var(--img) center/cover,rgba(var(--c),.03)}
.dhero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:72px;background:linear-gradient(rgba(0,0,0,0),var(--bg));pointer-events:none}
.dhero.no{display:grid;place-items:center;color:rgba(var(--c),.19)}
.dhero.no svg{width:72px;height:72px}
.dtop{position:fixed;left:0;right:0;top:0;z-index:6;pointer-events:none;transition:background .2s,box-shadow .2s}
.dtop h2{flex:1 0 0;min-width:0;align-self:center;font-size:16px;line-height:24px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
/* фото ушло вверх — появляется обычная шапка с названием */
.dtop.solid{background:var(--bg);box-shadow:inset 0 calc(-1 * var(--h7)) 0 rgba(var(--c),.1);pointer-events:auto}
.dtop.solid h2{opacity:1}
.dtop.solid .gb{color:rgb(var(--c));background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.06);-webkit-backdrop-filter:none;backdrop-filter:none}
.dtop .in{display:flex;justify-content:space-between;gap:16px;max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 20px 16px}
.gb{pointer-events:auto;flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:9999px;color:#fff;background:rgba(0,0,0,.3);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);box-shadow:inset 0 0 0 var(--h7) rgba(255,255,255,.2);transition:background .15s}
.gb svg{display:block;width:26px;height:26px}
.gb svg[viewBox="0 0 24 24"]{width:22px;height:22px}
@media (hover:hover){.gb:hover{background:rgba(0,0,0,.45)}}
.dish{display:flex;flex-direction:column;gap:16px;margin-top:32px;position:relative}
.dpic{aspect-ratio:1;border-radius:28px;background:var(--img) center/cover,rgba(var(--c),.03);box-shadow:inset 0 0 0 1px rgba(var(--c),.1)}
.dpic.no{display:grid;place-items:center;color:rgba(var(--c),.19)}
.dpic.no svg{width:72px;height:72px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dhead div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dhead h1{font-size:24px;line-height:32px;font-weight:600;word-break:break-word}
.dhead span{font-size:14px;line-height:20px;color:rgba(var(--c),.6)}
.dhead>b{flex:none;padding-top:4px;font-size:18px;line-height:24px;font-weight:500;color:rgba(var(--c),.9);font-variant-numeric:tabular-nums}
.dabout{font-size:16px;line-height:24px;color:rgba(var(--c),.8)}
.dsec{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.dsec h3{font-size:13px;line-height:18px;font-weight:500;color:rgba(var(--c),.5)}
.dsec>p{font-size:15px;line-height:22px;color:rgba(var(--c),.85)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kb div{display:flex;flex-direction:column;gap:2px;min-width:0;padding:12px;border-radius:16px;background:rgba(var(--c),.04)}
.kb b{font-size:18px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.kb span{font-size:12px;line-height:16px;color:rgba(var(--c),.6);overflow:hidden;text-overflow:ellipsis}
.dsec>.kbp{font-size:13px;line-height:18px;color:rgba(var(--c),.6)}
.dmore{gap:12px}
.dmore .it{flex:none;width:136px}
/* пока фото грузится — полупрозрачная подложка, как у блюда без фото (не белая) */
.pic{position:relative;aspect-ratio:1;border-radius:24px;background:var(--img) center/cover,rgba(var(--c),.03);box-shadow:inset 0 0 0 1px rgba(var(--c),.1)}
.pic.no{display:grid;place-items:center;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 1px rgba(var(--c),.06);color:rgba(var(--c),.19)}
.pic.no svg{width:44px;height:44px}
.it .tx{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-left:10px}
.it b{font-size:14px;line-height:20px;font-weight:600;word-break:break-word}
.it small{display:block;margin-top:-8px;font-size:12px;line-height:18px;color:rgba(var(--c),.6)}
.price{padding:5px 12px;border-radius:9999px;background:rgba(var(--c),.03);font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.empty{padding:40px 0;text-align:center;color:rgba(var(--c),.6)}
/* ===== Карта гостя: размер скидки сверху, крупный QR с кодом и номером, «Обновить код» ===== */
.gc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;min-height:100vh;min-height:100dvh;padding:96px 20px calc(80px + env(safe-area-inset-bottom));text-align:center}
.ghead{display:flex;flex-direction:column;align-items:center;gap:2px}
.ghead span{font-size:16px;line-height:24px;font-weight:500;color:rgba(var(--c),.7)}
.ghead b{font-size:56px;line-height:64px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.gqr{display:flex;flex-direction:column;align-items:center;gap:14px}
.gcode,.gnum{font-size:13px;line-height:18px;font-weight:500;letter-spacing:.08em;color:rgba(var(--c),.7);font-variant-numeric:tabular-nums;white-space:nowrap}
.gnum{font-size:20px;line-height:28px;letter-spacing:.1em;color:rgb(var(--c))}
.gqr svg{display:block;width:min(240px,64vw);height:auto;aspect-ratio:1;color:rgb(var(--c))}
.ghint{font-size:13px;line-height:18px;color:rgba(var(--c),.5)}
.rb svg[viewBox="0 0 24 24"]{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.bok svg *{animation:none!important}}
.terms{display:flex;flex-direction:column}
.terms div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;box-shadow:inset 0 calc(-1 * var(--h7)) 0 rgba(var(--c),.1)}
.terms div:last-child{box-shadow:none}
.terms .now span{color:rgb(var(--c));font-weight:600}
.terms.box{padding:4px 16px;border-radius:20px;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.12)}
/* уровень скидки: потрачено и сколько до следующей ступени, шкала, ступени плитками (точки шкалы стоят над центрами плиток) */
.lv{display:flex;flex-direction:column;gap:20px;padding:20px 16px 16px;border-radius:20px;background:rgba(var(--c),.03);box-shadow:inset 0 0 0 var(--h7) rgba(var(--c),.12)}
.lvtop{display:flex;justify-content:space-between;gap:16px}
.lvtop div{display:flex;flex-direction:column;gap:2px;min-width:0}
.lvtop .r{text-align:right}
.lvtop span{font-size:13px;line-height:18px;color:rgba(var(--c),.6)}
.lvtop b{font-size:24px;line-height:32px;font-weight:600;font-variant-numeric:tabular-nums}
.lvbar{position:relative;height:8px;margin:0 calc((100% - 18px) / 8)}
.lvbar::before{content:"";position:absolute;left:0;right:0;top:2px;height:4px;border-radius:2px;background:rgba(var(--c),.12)}
.lvbar i{position:absolute;left:0;top:2px;height:4px;border-radius:2px;background:rgb(var(--c))}
.lvbar s{position:absolute;top:0;width:8px;height:8px;margin-left:-4px;border-radius:9999px;background:var(--bg);box-shadow:inset 0 0 0 2px rgba(var(--c),.3)}
.lvbar s.on{background:rgb(var(--c));box-shadow:none}
.lvg{display:grid;gap:6px}
.lvg div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;border-radius:14px;background:rgba(var(--c),.04);text-align:center;color:rgba(var(--c),.5)}

  return ds}

/* подборка товаров (мерч и т. п.): та же сетка, что в меню, без категорий */
function shopHTML(id){var c=(D.cards||[]).filter(function(x){return x.id==id})[0];if(!c)return homeHTML("feed");var items=c.items||[];
  return topHTML(esc(c.title))+'<main class="menu" style="padding-top:104px"><div class="wrap">'+(items.length?'<div class="grid">'+items.map(itemHTML).join("")+'</div>':'<p class="empty">'+t("empty")+'</p>')+'</div></main>'+dock("")}
/* «красивый» QR: не настоящий код, но с узорами-ориентирами как у настоящего; рисунок одинаковый для одного заведения */
function qrSVG(seed){var n=25,h=0,i,x,y,s="";for(i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;function rnd(){h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296}
  function finder(x0,y0){return '<rect x="'+(x0+.5)+'" y="'+(y0+.5)+'" width="6" height="6" rx="1.6" fill="none" stroke="currentColor"/><rect x="'+(x0+2)+'" y="'+(y0+2)+'" width="3" height="3" rx=".8"/>'}
  function inF(x,y){return (x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9)}
  for(y=0;y<n;y++)for(x=0;x<n;x++){if(inF(x,y))continue;if((x>15&&x<21&&y>15&&y<21)&&!(x==18&&y==18)&&!(x==16||x==20||y==16||y==20))continue;if(rnd()<.47)s+='<rect x="'+(x+.08)+'" y="'+(y+.08)+'" width=".84" height=".84" rx=".28"/>'}
  s+='<rect x="16.5" y="16.5" width="4" height="4" rx="1" fill="none" stroke="currentColor" stroke-width=".9"/><rect x="18" y="18" width="1" height="1" rx=".3"/>';
  return '<svg viewBox="0 0 '+n+' '+n+'" fill="currentColor" aria-hidden="true">'+finder(0,0)+finder(n-7,0)+finder(0,n-7)+s+'</svg>'}
/* вакансии: карточка «Ищем в команду» открывает список, внизу одна кнопка «Откликнуться» */
function jobsHTML(id){var c=(D.cards||[]).filter(function(x){return x.id==id})[0];if(!c)return homeHTML("feed");
  return topHTML(esc(c.title))+'<main class="menu" style="padding-top:104px"><div class="wrap jobs">'+(c.jobs||[]).map(function(j){return '<article class="job"><h3>'+esc(j.name)+'</h3>'+(j.meta?'<small>'+esc(j.meta)+'</small>':'')+(j.desc?'<p>'+esc(j.desc)+'</p>':'')+'</article>'}).join("")+
    (c.href?'<a class="b pri" href="'+esc(c.href)+'"'+tgt+'>'+t("apply")+'</a>':'')+'</div></main>'+dock("")}
/* QR пока ненастоящий: рисунок, код над ним и номер карты одинаковые для одного заведения */
function qrBlock(){var L=D.loyalty||{},seed=(D.name||"")+(L.size||""),r=rng(seed),A="ABCDEFGHJKLMNPRSTUVWXYZ0123456789",code="",i,n=rng(D.name||"x"),num="";
  for(i=0;i<16;i++){code+=A[Math.floor(r()*A.length)];if(i%4==3&&i<15)code+=" "}
  for(i=0;i<12;i++){num+=Math.floor(n()*10);if(i%4==3&&i<11)num+=" "}
  return '<p class="gcode">'+code+'</p>'+qrSVG(seed)+'<p class="gnum">'+num+'</p>'}
function cardHTML(){var L=D.loyalty||{};
  return topHTML(t("card"),"","feed",'<button class="rb" data-go="terms" aria-label="'+t("terms")+'">'+INFO+'</button>')+'<main class="gc">'+
    '<div class="ghead"><span>'+esc(L.kind||t("disc"))+'</span><b>'+(function(s){return s.lv[s.cur].p})(lvState())+'%</b></div>'+
    '<div class="gqr" role="img" aria-label="QR">'+qrBlock()+'</div><p class="ghint">'+t("show")+'</p></main>'+dock("card")}
/* условия скидки — отдельный экран: уровень гостя (сколько потрачено, сколько до следующей ступени) и правила.
   Ступени и сумма пока демо: заведение потом задаст свои в D.loyalty.levels и D.loyalty.spent */
var LEVELS=[{p:3,from:0},{p:5,from:1000},{p:7,from:3000},{p:9,from:5000}];
function lvState(){var L=D.loyalty||{},lv=L.levels||LEVELS,sp=L.spent!=null?L.spent:640,cur=0;lv.forEach(function(x,k){if(sp>=x.from)cur=k});return {lv:lv,sp:sp,cur:cur}}
function levelHTML(){var s=lvState(),lv=s.lv,sp=s.sp,cur=s.cur,n=lv.length;
  var nx=lv[cur+1],part=nx?(sp-lv[cur].from)/(nx.from-lv[cur].from):0,fill=n>1?Math.min(1,(cur+part)/(n-1))*100:100;
  return '<div class="lv">'+
    '<div class="lvtop"><div><span>'+t("spent")+'</span><b>'+price(sp)+'</b></div>'+(nx?'<div class="r"><span>'+t("toNext").replace("{p}",nx.p+"%")+'</span><b>'+price(nx.from-sp)+'</b></div>':'<div class="r"><span>'+t("maxLv")+'</span><b>'+lv[cur].p+'%</b></div>')+'</div>'+
    '<div class="lvbar"><i style="width:'+fill.toFixed(2)+'%"></i>'+lv.map(function(x,k){return '<s class="'+(k<=cur?'on':'')+'" style="left:'+(n>1?k*100/(n-1):0).toFixed(2)+'%"></s>'}).join("")+'</div>'+
    '<div class="lvg" style="grid-template-columns:repeat('+n+',minmax(0,1fr))">'+lv.map(function(x,k){return '<div class="'+(k==cur?'cur':k<cur?'done':'')+'"><b>'+x.p+'%</b></div>'}).join("")+'</div>'+
    '</div>'}
function levelsList(){var s=lvState();return '<section class="bs"><h3>'+t("levels")+'</h3><div class="terms box">'+s.lv.map(function(x,k){
  return '<div'+(k==s.cur?' class="now"':'')+'><span>'+x.p+'%</span><b>'+(k==s.cur?cap(t("current")):x.from?t("from")+' '+price(x.from):t("start"))+'</b></div>'}).join("")+'</div></section>'}
function termsHTML(){var L=D.loyalty||{};
  return topHTML(t("terms"),"","card",'<span class="rb ghost" aria-hidden="true"></span>')+'<main class="menu" style="padding-top:104px"><div class="wrap bk">'+levelHTML()+
    levelsList()+'<section class="bs"><h3>'+t("rules")+'</h3><div class="terms box">'+[[t("linked"),"•• •••-45-67"],[t("scope"),L.scope],[t("stack"),L.stack?t("yes"):t("no")],[t("lvUp"),t("lvUpV")],[t("valid"),t("validV")],[t("welcome"),L.welcome]]
    .filter(function(r){return r[1]}).map(function(r){return '<div><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>'}).join("")+'</div></section></div></main>'+dock("card")}
function render(){colors(D.color||"#23151F");document.documentElement.lang=D.lang||"ru";tgt=D.newtab&&!embed?' target="_blank" rel="noopener"':'';
  if(!embed){document.title=D.name||"Портал";if(!D.seo&&!document.querySelector('meta[name="robots"]')){var m=document.createElement("meta");m.name="robots";m.content="noindex";document.head.appendChild(m)}}
  if(!D.online){$("#app").innerHTML='<div class="closed">'+t("closed")+'</div>';return}
  $("#app").innerHTML=view=="menu"?menuHTML():view=="card"?cardHTML():view=="terms"?termsHTML():view=="book"?bookHTML():view.indexOf("shop-")==0?shopHTML(view.slice(5)):view.indexOf("jobs-")==0?jobsHTML(view.slice(5)):view.indexOf("dish-")==0?dishHTML(+view.slice(5)):homeHTML(view=="about"?"about":"feed");
}
function sub(v){return v=="menu"||v=="card"||v=="terms"||v=="book"||v.indexOf("shop-")==0||v.indexOf("jobs-")==0||v.indexOf("dish-")==0} /* отдельные экраны с кнопкой «Назад» */
function known(h){return h=="menu"||h=="card"||h=="terms"||h=="book"||h=="about"||/^(shop|jobs)-[\w-]+$|^dish-\d+$/.test(h)}
/* карточка может открыть меню сразу на нужной вкладке (например, «Мерч») */
function catIndex(name){var cs=[];(D.menu||[]).forEach(function(i){if(cs.indexOf(i.cat)<0)cs.push(i.cat)});var k=cs.indexOf(name);return k<0?0:k+1}
var menuY=0;
function go(v,push,mcat){var wasHome=view=="feed"||view=="about",was=view,y=scrollY,fromDish=v=="menu"&&was.indexOf("dish-")==0;if(was=="menu"&&v.indexOf("dish-")==0)menuY=y;view=v;if(v=="menu"&&!fromDish)cat=mcat?catIndex(mcat):0;render();
  if(v=="menu"&&cat){var on=document.querySelector(".chips .tab.on");if(on)on.scrollIntoView({block:"nearest",inline:"center"})}
  if(v=="book"){var ts=document.querySelector("#bkT .on");if(ts)ts.scrollIntoView({block:"nearest",inline:"center"})}
  if(fromDish)scrollTo(0,menuY);else if(v.indexOf("dish-")==0)scrollTo(0,0);else if(sub(v)||!wasHome)scrollTo(0,0);else scrollTo(0,y);
  if(push&&!embed){var h=v=="feed"?location.pathname+location.search:"#"+v;if((sub(v)&&!sub(was))||(v=="terms"&&was=="card")||(v.indexOf("dish-")==0&&was=="menu"))history.pushState(null,"",h);else history.replaceState(null,"",h)}}
document.addEventListener("click",function(e){
  var k=e.target.closest("[data-bk]");if(k){if(!k.disabled)bkClick(k);return}var g=e.target.closest("[data-go]");if(g){e.preventDefault();var v=g.dataset.go;if(((v=="feed"&&sub(view))||(v=="card"&&view=="terms")||(v=="menu"&&view.indexOf("dish-")==0))&&!embed&&history.state!==undefined&&location.hash){history.back();return}go(v,true,g.dataset.mcat);return}
  if(e.target.closest("[data-share]")){var u=location.href.split("#")[0];if(navigator.share&&!embed)navigator.share({title:D.name,url:u}).catch(function(){});else if(navigator.clipboard&&!embed)navigator.clipboard.writeText(u).catch(function(){});return}
  var c=e.target.closest("[data-cat]");if(c){cat=+c.dataset.cat;var sx=$(".chips").scrollLeft;render();$(".chips").scrollLeft=sx;scrollTo(0,0);return}
  if(embed){var l=e.target.closest("a[href]");if(l)e.preventDefault()}});
document.addEventListener("input",function(e){if(e.target.id=="bkN")B.name=e.target.value;if(e.target.id=="bkP")B.ph=e.target.value;e.target.classList.remove("err")});
function dtop(){var d=$(".dtop"),h=$(".dhero");if(d&&h)d.classList.toggle("solid",h.getBoundingClientRect().bottom<d.offsetHeight)}
addEventListener("scroll",dtop,{passive:true});
addEventListener("popstate",function(){var h=location.hash.slice(1);go(known(h)?h:"feed",false)});
/* фото меню и товаров подгружаем заранее, пока гость смотрит ленту — к открытию экрана они уже в кеше */
var pre=false;function preload(){if(pre||!D||!D.online)return;pre=true;var u=(D.menu||[]).map(function(i){return i.img});(D.cards||[]).forEach(function(c){(c.items||[]).forEach(function(i){u.push(i.img)})});
  u.filter(Boolean).forEach(function(s,i){setTimeout(function(){var im=new Image();im.decoding="async";im.src=s},300+i*60)})}
if(embed){addEventListener("message",function(e){if(e.data&&e.data.type=="portal"){D=e.data.data;render()}});parent.postMessage({type:"portal-ready"},"*")}
else fetch("portal.json",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){D=d;var h=location.hash.slice(1);view=known(h)?h:"feed";render();(window.requestIdleCallback||setTimeout)(preload)})
  .catch(function(){D={online:false,lang:"ru"};render()});
})();
</script>
