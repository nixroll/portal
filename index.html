<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#FFFFFF" id="themeColor">
<title>Главная — Портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   Портал v3 — оболочка кабинета по макету Figma (Portal → Portal Light / Portal Dark,
   Sidebar и Toolbar design system). Цвета — токены коллекции «1. Color modes»:
   Light mode / Dark mode. Размеры и отступы — один в один с Figma.
   ===================================================================== */
/* --h — «полпикселя» из макета: ровно 1 физический пиксель экрана. На ретине 2× это 0,5 px, на iPhone 3× — 2 физических пикселя, на обычном экране — 1 px.
   Все полупиксельные рамки и отступы считаются от него, поэтому края не попадают между пикселями и не мылятся */
:root{--h:.5px}
@media (min-resolution:2.5dppx){:root{--h:.671875px}} /* 3×: 2 физ. пикселя = 43/64 px — шаг раскладки WebKit, линия не пропадает и не мылится */
@media (max-resolution:1.49dppx){:root{--h:1px}}
:root,.pv[data-theme="light"]{
  --bg-secondary-alt:#FAFAFA;     /* фон страницы */
  --bg-primary-alt:#FFFFFF;       /* рабочая панель и тулбар */
  --bg-primary:#FFFFFF;           /* плашка аватара без картинки */
  --bg-secondary-hover:#F5F5F5;   /* наведение / выбранный пункт */
  --border-primary:#D5D7DA;       /* рамка выбранного пункта */
  --border-secondary-alt:rgba(0,0,0,.08); /* рамка панели и линия тулбара */
  --text-primary:#181D27;
  --text-secondary:#414651;
  --text-tertiary:#535862;
  --fg-primary:#181D27;
  --fg-secondary:#414651;
  --fg-tertiary:#535862;
  --indigo-500:#6172F3;
  --bg-tertiary:#F5F5F5;          /* фон соцкнопок и выключенного тумблера */
  --border-secondary:#E9EAEB;     /* рамка карточки настройки */
  --border-tertiary:#F5F5F5;      /* обводка аватара в превью */
  --brand-solid:#7F56D9; --brand-solid-hover:#6941C6; /* включённый тумблер */
  --border-brand:#9E77ED; --text-placeholder:#717680; --bg-primary-hover:#FAFAFA;
  --fg-quaternary:#A4A7AE; --fg-brand-primary:#7F56D9; --bg-quaternary:#E9EAEB; --text-error:#D92D20;
  --shadow-xl:0 20px 24px -4px rgba(10,13,18,.08),0 8px 8px -4px rgba(10,13,18,.03),0 3px 3px -1.5px rgba(10,13,18,.04);
  --shadow-lg:0 12px 16px -4px rgba(10,13,18,.08),0 4px 6px -2px rgba(10,13,18,.03),0 2px 2px -1px rgba(10,13,18,.04);
  --shadow-xs:0 1px 2px rgba(10,13,18,.05);
  --shadow-sm:0 1px 3px rgba(10,13,18,.1),0 1px 2px -1px rgba(10,13,18,.1);           /* иконка выбранного пункта (примитив, одинаков в обеих темах) */
  --side-w:var(--side-drag,240px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg-secondary-alt:#0C0E12; --bg-primary-alt:#13161B; --bg-primary:#0C0E12; --bg-secondary-hover:#22262F;
    --border-primary:#373A41; --border-secondary-alt:#22262F;
    --text-primary:#F7F7F7; --text-secondary:#CECFD2; --text-tertiary:#94979C;
    --fg-primary:#FFFFFF; --fg-secondary:#CECFD2; --fg-tertiary:#94979C; --bg-tertiary:#22262F; --border-secondary:#22262F; --border-tertiary:#22262F; --brand-solid-hover:#9E77ED; --border-brand:#B692F6; --text-placeholder:#85888E; --bg-primary-hover:#22262F; --fg-quaternary:#61656C; --fg-brand-primary:#9E77ED; --bg-quaternary:#373A41; --text-error:#F97066; --shadow-xl:0 0 0 transparent; --shadow-xs:0 0 0 transparent; --shadow-sm:0 0 0 transparent; --shadow-lg:0 0 0 transparent; color-scheme:dark}
}
:root[data-theme="dark"],.pv[data-theme="dark"]{
  --bg-secondary-alt:#0C0E12; --bg-primary-alt:#13161B; --bg-primary:#0C0E12; --bg-secondary-hover:#22262F;
  --border-primary:#373A41; --border-secondary-alt:#22262F;
  --text-primary:#F7F7F7; --text-secondary:#CECFD2; --text-tertiary:#94979C;
  --fg-primary:#FFFFFF; --fg-secondary:#CECFD2; --fg-tertiary:#94979C; --bg-tertiary:#22262F; --border-secondary:#22262F; --border-tertiary:#22262F; --brand-solid-hover:#9E77ED; --border-brand:#B692F6; --text-placeholder:#85888E; --bg-primary-hover:#22262F; --fg-quaternary:#61656C; --fg-brand-primary:#9E77ED; --bg-quaternary:#373A41; --text-error:#F97066; --shadow-xl:0 0 0 transparent; --shadow-xs:0 0 0 transparent; --shadow-sm:0 0 0 transparent; --shadow-lg:0 0 0 transparent; color-scheme:dark}

/* ---------- чёткий рендер ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
html.ios-zoom body{height:calc(100vh / var(--z));height:calc(100dvh / var(--z))} /* zoom увеличивает и высоту экрана — делим обратно */
body{height:100vh;height:100dvh;overflow:hidden;background:var(--bg-secondary-alt);color:var(--text-primary);
  font:400 14px/20px Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}
:focus-visible{outline:2px solid var(--indigo-500);outline-offset:2px}

/* ---------- каркас: поля 8, между сайдбаром и панелью 8 ---------- */
.app{display:flex;gap:8px;height:100%;padding:8px;min-width:720px}

/* ---------- Sidebar: 240–360 px, без фона, три зоны: Top 64 / навигация по центру / Bottom 64 ---------- */
.side{position:relative;flex:none;width:var(--side-w);display:grid;grid-template-rows:64px minmax(0,1fr) 64px;row-gap:16px;min-height:0}
.s-top{padding:5px 4px;overflow:hidden}
.s-mid{min-height:0;overflow-y:auto;scrollbar-width:none}
.s-mid::-webkit-scrollbar{display:none}
.s-bot{display:flex;flex-direction:column;justify-content:flex-end;padding:6px 0;overflow:hidden}

/* Account row: 34 px, поля 4 8 4 4, между картинкой и текстом 10; Hover — bg-secondary_hover */
.acct{display:inline-flex;align-items:center;gap:10px;max-width:100%;height:34px;padding:4px 8px 4px 4px;border-radius:10px}
.acct:hover{background:var(--bg-secondary-hover)}
.acct .ava{position:relative;flex:none;width:26px;height:26px;border-radius:8px;overflow:hidden;background:var(--bg-primary)}
.acct .ava img{display:block;width:26px;height:26px}
.acct .ava::after{content:"";position:absolute;inset:0;border-radius:8px;border:1px solid rgba(0,0,0,.1)} /* stroke 1 inside, #000 10% */
.acct .ava b{display:grid;place-items:center;width:26px;height:26px;font-weight:500;color:var(--text-primary)}
.acct span{min-width:0;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Навигация: поля 0 4, между пунктами 2 px */
.nav{display:flex;flex-direction:column;gap:2px;padding:0 4px}
/* Nav item: 37 px (рамка 0,5 внутри + 8 + 20 + 8), поля 8 12 8 10, иконка 16, отступ 8, скругление 10.
   Normal — текст text-secondary, иконка fg-tertiary, счётчик text-tertiary;
   Hover и Selected — фон bg-secondary_hover, рамка border-primary 0,5, иконка Indigo 500, текст text-primary, счётчик text-secondary */
/* рамку 0,5 рисуем тенью внутрь: браузер округляет border меньше 1 px до 1 px и сдвигает раскладку, тень — нет */
.nav a{display:flex;align-items:center;gap:8px;height:37px;padding:calc(8px + var(--h)) calc(12px + var(--h)) calc(8px + var(--h)) calc(10px + var(--h));border-radius:10px;
  font-weight:500;color:var(--text-secondary)}
.nav a svg{width:16px;height:16px;color:var(--fg-tertiary)}
.nav a .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a .c{flex:none;font-weight:400;color:var(--text-tertiary)}
.nav a:hover,.nav a[aria-current="page"]{background:var(--bg-secondary-hover);box-shadow:inset 0 0 0 var(--h) var(--border-primary);color:var(--text-primary)}
.nav a:hover svg,.nav a[aria-current="page"] svg{color:var(--indigo-500)}
.nav a:hover .c,.nav a[aria-current="page"] .c{color:var(--text-secondary)}

/* Location row: 28 px, поля 4 8, иконка 16, отступ 8; Hover — фон bg-secondary_hover, иконка fg-secondary, текст text-primary */
.loc{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;max-width:100%;height:28px;padding:4px 8px;border-radius:10px;font-weight:500;color:var(--text-secondary)}
.loc svg{width:16px;height:16px;color:var(--fg-tertiary)}
.loc span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc:hover{background:var(--bg-secondary-hover);color:var(--text-primary)}
.loc:hover svg{color:var(--fg-secondary)}

/* ширина сайдбара: тянем за промежуток справа (240–360 px), двойной клик — 240 */
.rz{position:absolute;top:0;bottom:0;right:-8px;width:8px;cursor:col-resize;touch-action:none;z-index:2}
body.rzing{cursor:col-resize;user-select:none}

/* ---------- Playground: рабочая панель, bg-primary_alt, рамка 0,5 border-secondary_alt внутри, скругление 10 ---------- */
.pg{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg-primary-alt);
  border-radius:10px;overflow:hidden}
.pg::after{content:"";position:absolute;inset:0;z-index:7;border-radius:10px;box-shadow:inset 0 0 0 var(--h) var(--border-secondary-alt);pointer-events:none} /* stroke 0,5 inside */
/* Toolbar: 44 px, линия 0,5 снизу снаружи; Container 28 px, поля 0 8 0 16 */
.tb{position:absolute;top:var(--h);left:var(--h);right:var(--h);z-index:6; /* выше закреплённых вкладок (z 5), иначе их фон перекрывает линию под тулбаром */ height:44px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 8px 0 16px;background:var(--bg-primary-alt);box-shadow:0 var(--h) 0 var(--border-secondary-alt)} /* линия 0,5 снизу снаружи */
.tl{flex:1;min-width:0;display:flex;align-items:center;gap:16px}
/* Sidebar button: 20×20, иконка layout-left 14 (слева, по центру по высоте); Normal — fg-secondary, Hover — fg-primary. На десктопе скрыта */
.sbb{display:none;flex:none;align-items:center;width:20px;height:20px;color:var(--fg-secondary)}
.sbb svg{width:14px;height:14px}
.sbb:hover{color:var(--fg-primary)}
.tb h1{flex:1;min-width:0;font-size:14px;line-height:20px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Add button: 28 px, капсула, поля 0 12 0 8, иконка plus 14, отступ 6, текст Text xs/Semibold 12/18; Hover — bg-secondary_hover */
.addb{flex:none;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px 0 8px;border-radius:9999px;
  font-size:12px;line-height:18px;font-weight:600;color:var(--text-secondary)}
.addb svg{width:14px;height:14px;color:var(--fg-secondary)}
.addb:hover{background:var(--bg-secondary-hover)}
.body{flex:1;min-height:0;position:relative;margin-top:44px;overflow:auto}

/* Пустое состояние: картинка 96×96, отступ 8, текст Text md/Medium 16/24 text-secondary, поля 0 16 */
.empty{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px}
.empty img{display:block;width:96px;height:96px}
.empty p{font-size:16px;line-height:24px;font-weight:500;color:var(--text-secondary);white-space:nowrap}

/* ---------- Планшет и телефон (уже 1024 px): сайдбар прячется, панель во весь экран, в тулбаре кнопка меню ---------- */
@media (max-width:1023px){
  .app{padding:0;gap:0;min-width:0}
  html,body{background:var(--bg-primary-alt)} /* на телефоне один цвет: статус-бар, панель и низ Safari сливаются */
  .pg{border-radius:0}
  .pg::after{display:none}
  .tb{top:1px;left:0;right:0}
  .sbb{display:flex}
  .rz{display:none}
  /* Mobile Sidebar: лист 256 px (поля 8 + меню 240), фон bg-primary_alt, линия 1 px справа снаружи, скругление справа 10 */
  .side{position:fixed;z-index:20;top:0;left:0;bottom:0;width:256px;height:100%;padding:8px;background:var(--bg-primary-alt);
    border-radius:0 10px 10px 0;box-shadow:1px 0 0 var(--border-secondary-alt);transform:translateX(calc(-100% - 2px));visibility:hidden;
    transition:transform .3s cubic-bezier(0,0,.58,1),visibility 0s linear .3s}
  body.nav-open .side{transform:none;visibility:visible;transition:transform .3s cubic-bezier(0,0,.58,1)}
  /* затемнение под шторкой: как overlay в прототипе Figma — #000 30 %, закрывается нажатием мимо; выезд 0,3 с ease-out */
  .scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.3);opacity:0;visibility:hidden;transition:opacity .3s cubic-bezier(0,0,.58,1),visibility 0s linear .3s}
  body.nav-open .scrim{opacity:1;visibility:visible;transition:opacity .3s cubic-bezier(0,0,.58,1)}
}
.scrim{display:none}
@media (max-width:1023px){.scrim{display:block}}
/* ===== TABBAR: нижняя панель на телефоне (до 767 px), как в мобильных приложениях. Откат — ?tabbar=0 или убрать блоки TABBAR =====
   Высота 56, иконки 24, неактивные fg-tertiary, активная — акцентный цвет; «•••» открывает боковое меню */
.tabbar{display:none}
@media (max-width:767px){
  body.tb-on .tabbar{position:fixed;z-index:15;left:0;right:0;bottom:0;display:flex;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
    background:var(--bg-primary-alt);box-shadow:inset 0 var(--h) 0 var(--border-secondary-alt)}
  body.tb-on .app{padding-bottom:calc(56px + env(safe-area-inset-bottom))}
  body.tb-on .sbb{display:none}
  .tabbar button{position:relative;flex:1;display:grid;place-items:center;color:var(--fg-tertiary);-webkit-tap-highlight-color:transparent}
  .tabbar button svg{width:24px;height:24px}
  .tabbar button[aria-current="page"]{color:var(--indigo-500)}
  .tabbar button:active svg{transform:scale(.92)}
  .tabbar .bd{position:absolute;top:calc(50% - 13px);left:calc(50% + 6px);width:8px;height:8px;border-radius:9999px;background:var(--brand-solid);box-shadow:0 0 0 2px var(--bg-primary-alt)} /* непрочитанное — точка, без цифры */
  body.nobadge .tabbar .bd{display:none}
}
/* ===== /TABBAR ===== */
@media (prefers-reduced-motion:reduce){.side,.scrim{transition:none!important}}
/* =================== Портал (мини-сайт заведения): вкладки, настройки, превью справа =================== */
/* Selector: 28 px, капсула, поля 0 12, рамка 0,5 border-primary, тень shadow-xs, текст Text xs/Medium 12/18.
   Normal — bg-primary_alt, text-secondary; Hover и Selected — bg-secondary_hover, text-primary */
.psel{display:flex;flex-wrap:wrap;gap:6px;padding:16px}
/* вкладки закреплены: при прокрутке остаются сверху, контент уходит под них (фон — как у панели) */
.portal .psel,.settings .psel{position:sticky;top:0;z-index:5;background:var(--bg-primary-alt)}
.psel button{display:inline-flex;align-items:center;height:32px;padding:0 calc(12px + var(--h));border-radius:9999px;background:var(--bg-primary-alt);
  box-shadow:inset 0 0 0 var(--h) var(--border-primary),var(--shadow-xs);font-size:12px;line-height:18px;font-weight:500;color:var(--text-secondary);white-space:nowrap}
.psel button span{display:inline-block}
.psel button:hover,.psel button[aria-selected="true"]{background:var(--bg-secondary-hover);color:var(--text-primary)}
.psel.m{display:none}
/* Карточка настройки: фон bg-tertiary, рамка и разделители 0,5 border-primary, поля и контролы на bg-primary_alt; скругление 10, поля внутри 16, отступ 10 */
/* Содержимое вкладки: отступ 10 после вкладок, поля 16, между карточками 16 */
.pcont{display:flex;flex-direction:column;gap:32px;padding:16px 16px 32px} /* между вкладками и контентом 0 — по макету */
.pcont[hidden]{display:none}
/* Карточка настроек: рамка 0,5 border-secondary внутри (в раскладке), скругление 10 */
.pc{padding:var(--h);border-radius:10px;background:var(--bg-tertiary);box-shadow:inset 0 0 0 var(--h) var(--border-primary)}
/* Строка: поля 16, отступ 16; со второй строки — линия 0,5 сверху (в раскладке) */
.pr{display:flex;align-items:center;gap:16px;padding:16px}
.pr+.pr{padding-top:calc(16px + var(--h));background:linear-gradient(var(--border-primary),var(--border-primary)) 16px 0/calc(100% - 32px) var(--h) no-repeat} /* как в Linear: линия с отступами от краёв карточки */
.pr .tx{flex:1;min-width:0}
.pr .tx b{display:block;font-weight:500;color:var(--text-primary);text-wrap:pretty}
.pr .tx small{display:block;font-size:12px;line-height:18px;color:var(--text-secondary);text-wrap:pretty} /* как в Linear: не обрезаем, а переносим на следующую строку */
.pr .tx small em{font-style:normal;color:var(--text-primary)}
.pr .ct{flex:none;display:flex;align-items:center;gap:8px}
/* Поле ввода портала: 32 px, скругление 8, bg-primary, рамка 0,5 border-primary, тень shadow-xs, текст Text sm/Regular; фокус — рамка border-brand */
.pin.ta{height:auto;min-height:112px;padding:6px calc(10px + var(--h));line-height:20px;resize:vertical;font:inherit}
.pin{display:block;width:280px;height:32px;padding:0 calc(10px + var(--h));border:0;border-radius:8px;background:var(--bg-primary-alt);color:var(--text-primary);
  box-shadow:inset 0 0 0 var(--h) var(--border-primary),var(--shadow-xs);font:400 14px/20px Inter,system-ui,sans-serif;outline:none;text-overflow:ellipsis}
.pin::placeholder{color:var(--text-placeholder)}
.pin:focus{box-shadow:inset 0 0 0 1px var(--border-brand),var(--shadow-xs)}
.pin[readonly]{cursor:default}
.pin.w184{width:184px}.pin.w224{width:224px}
/* Кнопка — тот же компонент Selector: капсула 28 px */
.chip{display:inline-flex;align-items:center;height:32px;padding:0 calc(12px + var(--h));border-radius:9999px;background:var(--bg-primary-alt);
  box-shadow:inset 0 0 0 var(--h) var(--border-primary),var(--shadow-xs);font-size:12px;line-height:18px;font-weight:500;color:var(--text-secondary);white-space:nowrap}
.chip:hover{background:var(--bg-secondary-hover);color:var(--text-primary)}
/* Миниатюры: логотип 32 кругом, фото 56×36 со скруглением 6, рамка 0,5 border-secondary */
.thumb{position:relative;flex:none;width:56px;height:36px;border-radius:6px;background:var(--img) center/cover}
.thumb.logo{width:32px;height:32px;border-radius:9999px}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 var(--h) var(--border-secondary)}
/* _Toggle base sm: 36×20, поля 2, кружок 16 (fg-white, тень shadow-sm). Вкл — bg-brand-solid (наведение — brand-solid_hover), выкл — bg-tertiary */
.tgl{flex:none;position:relative;width:36px;height:20px;padding:2px;border-radius:9999px;background:var(--bg-tertiary)}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:9999px;background:#fff;box-shadow:var(--shadow-sm);transition:left .15s ease}
.tgl[aria-checked="true"]{background:var(--brand-solid)}
.tgl[aria-checked="true"]:hover{background:var(--brand-solid-hover)}
.tgl[aria-checked="true"]::after{left:18px}
.pc .tgl:not([aria-checked="true"]){background:var(--bg-quaternary)} /* на карточке bg-tertiary выключенный тумблер темнее/светлее фона, иначе сливается */
/* Разделы вкладки (как в настройках Linear): между разделами 32, заголовок → карточки 12, между карточками 8.
   Заголовок — Text md/Semibold, по левому краю совпадает с названиями строк (16 внутри карточки) */
.psec{display:flex;flex-direction:column;gap:8px}
.psec h3{margin:0 0 4px;padding:0 calc(16px + var(--h));font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary)}
.pr[hidden]{display:none}
.pr.off .ct{opacity:.5;pointer-events:none}
.pin.w120{width:120px}.pin.w280{width:280px}
.dash{font-style:normal;color:var(--text-tertiary)}
